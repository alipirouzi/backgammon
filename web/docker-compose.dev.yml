# Local development database for the web app — development and tests only.
# Production runs deploy/docker-compose.prod.yml (app + postgres on the host);
# CI starts the same postgres:16-alpine as a service container in
# .github/workflows/ci.yml. Nothing here is shipped.
#
#   docker compose -f web/docker-compose.dev.yml up -d --wait
#   export DATABASE_URL=postgresql://backgammon:dev@127.0.0.1:5439/backgammon
#   pnpm --filter web prisma:migrate:deploy
#   docker compose -f web/docker-compose.dev.yml down -v      # drop it again, data included
#
# Port 5439 on the loopback interface only, so it neither clashes with a
# PostgreSQL on 5432 nor listens on the network. "dev" is a local throwaway
# password (override with POSTGRES_PASSWORD in the environment and change
# DATABASE_URL to match). The container name matches the `docker run` the test
# headers mention, so `docker rm -f bg-dev-postgres` still works too.
name: bg-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: bg-dev-postgres
    environment:
      POSTGRES_USER: backgammon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: backgammon
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backgammon -d backgammon"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:

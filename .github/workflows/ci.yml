name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # wasm-pack is pinned by version AND sha256. The GitHub release publishes no
  # checksum asset, so the digest below was computed on 2026-09-07 from
  # wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz (2,881,231 bytes) and
  # was identical when fetched via both the canonical wasm-bindgen/wasm-pack
  # and the legacy rustwasm/wasm-pack (redirect) release URLs.
  # Bumping the version requires recomputing the digest.
  WASM_PACK_VERSION: 0.15.0
  WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
  # wasm-pack would otherwise download wasm-bindgen-cli and binaryen (wasm-opt)
  # unverified at build time. Both are installed here from pinned release
  # tarballs instead and `wasm-pack build --mode no-install` forbids any
  # download. wasm-bindgen-cli must match the `wasm-bindgen` crate version in
  # engine/bg-wasm/Cargo.toml; binaryen version_117 is the release wasm-pack
  # 0.15.0 would fetch itself. Digests computed on 2026-09-07 and cross-checked
  # against the upstream checksum assets
  # (wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz.sha256sum,
  # binaryen-version_117-x86_64-linux.tar.gz.sha256). The Dockerfile carries
  # the same four pins; bump them together.
  WASM_BINDGEN_VERSION: 0.2.127
  WASM_BINDGEN_SHA256: 61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a
  BINARYEN_VERSION: version_117
  BINARYEN_SHA256: 3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Perf budget, full decision-vector drift and bg-wasm full replay (release)
        run: |
          set -o pipefail
          cargo test --release -p bg-bot -p bg-wasm --test perf --test vectors -- --include-ignored --show-output 2>&1 | tee release-tests.log
          grep -q '^test perf_mean_club_decision_from_middlegame_is_under_budget \.\.\. ok$' release-tests.log
          grep -q '^test committed_decisions_json_equals_regenerated_output \.\.\. ok$' release-tests.log
          grep -q '^test choose_play_reproduces_every_entry_of_decisions_json \.\.\. ok$' release-tests.log
      - run: cargo build --target wasm32-unknown-unknown -p bg-core -p bg-bot

      # --- bindings: bg-wasm (WebAssembly) and bg-node (napi-rs native addon) ---
      - name: bg-wasm must not depend on getrandom (seeds come from callers)
        run: |
          set -euo pipefail
          tree=$(cargo tree -p bg-wasm --target wasm32-unknown-unknown)
          # grep -c exits 1 on zero matches, which is the passing case here.
          count=$(grep -c getrandom <<<"$tree" || true)
          echo "getrandom occurrences in the wasm32 dependency tree: $count"
          test "$count" -eq 0
      - run: cargo clippy -p bg-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Install wasm-pack, wasm-bindgen-cli and wasm-opt (pinned release tarballs, sha256-verified)
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          dir="$RUNNER_TEMP/wasm-tools"
          mkdir -p "$dir"
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/wasm-pack"
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/wasm-bindgen"
          name="binaryen-${BINARYEN_VERSION}-x86_64-linux"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${name}.tar.gz"
          echo "${BINARYEN_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=2 "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          rm "$dir"/*.tar.gz
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/wasm-pack" --version
          "$dir/wasm-bindgen" --version
          "$dir/wasm-opt" --version
      - name: Build bg-wasm (bundler target) into engine/bg-wasm/pkg
        # --mode no-install: use the verified wasm-bindgen and wasm-opt on PATH; never download.
        run: wasm-pack build engine/bg-wasm --target bundler --release --out-dir pkg --out-name bg_wasm --mode no-install
        working-directory: .
      - name: engine/bg-wasm/pkg must exist before pnpm install
        # `pnpm install --frozen-lockfile` does not fail when a workspace package
        # directory is missing (it leaves a dangling symlink), so assert it here.
        run: test -f engine/bg-wasm/pkg/package.json && test -f engine/bg-wasm/pkg/bg_wasm.js
        working-directory: .
      # pnpm needs engine/bg-wasm/pkg to exist: it is a workspace package.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter bg-node build
        working-directory: .
      - run: pnpm --filter bg-node test
        working-directory: .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # The web workspace depends on `bg-wasm` (engine/bg-wasm/pkg), a generated
      # workspace package: build it before `pnpm install`. A missing pkg does not
      # fail `pnpm install --frozen-lockfile`; the assertion step below and the
      # `CI` guard in web/tests/engine-parity.test.ts fail instead.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install wasm-pack, wasm-bindgen-cli and wasm-opt (pinned release tarballs, sha256-verified)
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          dir="$RUNNER_TEMP/wasm-tools"
          mkdir -p "$dir"
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/wasm-pack"
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/wasm-bindgen"
          name="binaryen-${BINARYEN_VERSION}-x86_64-linux"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/${name}.tar.gz"
          echo "${BINARYEN_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=2 "binaryen-${BINARYEN_VERSION}/bin/wasm-opt"
          rm "$dir"/*.tar.gz
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/wasm-pack" --version
          "$dir/wasm-bindgen" --version
          "$dir/wasm-opt" --version
      - name: Build bg-wasm (bundler target) into engine/bg-wasm/pkg
        # --mode no-install: use the verified wasm-bindgen and wasm-opt on PATH; never download.
        run: wasm-pack build engine/bg-wasm --target bundler --release --out-dir pkg --out-name bg_wasm --mode no-install
        working-directory: .
      - name: engine/bg-wasm/pkg must exist before pnpm install
        # `pnpm install --frozen-lockfile` does not fail when a workspace package
        # directory is missing (it leaves a dangling symlink), so assert it here.
        run: test -f engine/bg-wasm/pkg/package.json && test -f engine/bg-wasm/pkg/bg_wasm.js
        working-directory: .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        id: e2e
      - uses: actions/upload-artifact@v4
        # The screenshot matrix (3 themes x 3 widths of /play/local-42, written by
        # web/e2e/themes.spec.ts) is uploaded on every run, pass or fail, so a
        # reviewer can look at the board without checking the branch out.
        if: ${{ always() }}
        with:
          name: screens
          path: web/test-results/screens/
      - uses: actions/upload-artifact@v4
        # Only when the e2e step itself failed; the HTML report is configured in web/playwright.config.ts.
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-report
          path: web/playwright-report/
